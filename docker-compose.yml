services:
  astra-rag:
    build:
      context: .
      dockerfile: Dockerfile.rag
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:?defina GROQ_API_KEY no .env}
      RAG_API_TOKEN: ${RAG_API_TOKEN:?defina RAG_API_TOKEN no .env}
    # Sem "ports": só o gateway enxerga o Astra, pela rede interna do compose.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  ai-gateway:
    build: ./ai-gateway-java
    depends_on:
      astra-rag:
        condition: service_healthy
    environment:
      ASTRA_BASE_URL: http://astra-rag:8000
      ASTRA_TOKEN: ${RAG_API_TOKEN}
    ports:
      - "8080:8080"
