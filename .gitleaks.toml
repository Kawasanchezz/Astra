title = "Astra"

[extend]
useDefault = true

[[allowlists]]
description = "Dependências, caches e bibliotecas de terceiros minificadas"
paths = [
    '''(^|/)\.venv/''',
    '''(^|/)\.cache/''',
    '''(^|/)promo/''',
    '''(^|/)target/''',
    '''landing-page/js/vendor/''',
]

[[allowlists]]
description = "Valores falsos usados como fixture nos testes do filtro de segredos e de injecao"
regexes = [
    '''valor-secreto-do-ambiente-123''',
    '''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.abcdefghijk123''',
]

[[allowlists]]
description = "Bytecode gerado localmente (nao versionado)"
paths = [
    '''__pycache__/''',
]
